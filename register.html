<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="w-[375px] bg-white rounded-3xl shadow-xl p-6">

    <h1 class="text-2xl font-bold text-green-700 text-center mb-6">
        🌾 Farmer Registration
    </h1>

    <form method="POST">

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                Name
            </label>

            <input
                type="text"
                name="name"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                Email
            </label>

            <input
                type="email"
                name="email"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <div class="mb-6">
            <label class="block mb-2 font-semibold">
                Password
            </label>

            <input
                type="password"
                name="password"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <button
            type="submit"
            class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">

            Register
        </button>

    </form>

</div>

</body>
</html>
