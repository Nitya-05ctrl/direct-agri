<body class="bg-surface font-body text-on-surface antialiased min-h-screen flex flex-col">
<main class="flex-grow flex flex-col relative overflow-hidden">
<!-- Hero Decorative Section -->
<div class="relative h-[309px] w-full overflow-hidden">
<div class="absolute inset-0 bg-gradient-to-b from-primary/20 to-surface z-10"></div>
<img alt="Vibrant green agricultural field" class="w-full h-full object-cover" data-alt="expansive sun-drenched lush green rolling hills of a sustainable farm at sunrise with soft morning mist and warm golden light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCG9zKmnxlKT1sBoOcVRpmkB2LNJbhCCQZFmIq22GWRaAVqtj2W0X0hTL1ynZeVTCY-gMyggsmrMQnG8rc5iXVSPza0spjxubZSyQKDYQ70FeJSoMuoRkKHm_SWDsLN8MXGJMgXSkP4reL-AtT2z2Kmxe6giD3-NHeCsuGoGUyMdD-vKqr45ClFDR28LEiO0heHHbmDmCt3pOYwkwe51tsNDXpO6atlB5PjJI7acDJkccIQtX2EHri0tbOH06wLlMbLUpLANMea5rw"/>

<span class="material-symbols-outlined text-primary text-4xl" data-icon="agriculture">agriculture</span>
<h1 class="font-headline font-extrabold text-3xl tracking-tighter text-primary">AgriDirect</h1>
</div>
<p class="text-on-surface-variant font-medium max-w-[280px] leading-snug">
                    Bridging the gap between the fertile soil and your market.
                </p>
</div>
</div>
<!-- Login Card Section -->
<div class="flex-grow bg-surface rounded-t-[2.5rem] -mt-10 z-30 px-8 pt-10 pb-12 shadow-[0_-12px_40px_rgba(24,29,22,0.04)]">
<div class="space-y-1 mb-8">
<h2 class="font-headline font-bold text-2xl text-on-surface">Welcome back</h2>
<p class="text-label-md text-on-surface-variant/70 tracking-wide uppercase font-semibold">Sign in to continue</p>
</div>
<!-- Form -->
<form method="POST" class="space-y-6">
<!-- Mobile/Email Field -->
<div class="space-y-2">
<label class="block text-sm font-semibold text-on-surface-variant px-1">Email or Mobile Number</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="alternate_email">alternate_email</span>
<input
    type="email"
    name="email"
    class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container transition-all placeholder:text-outline-variant"
    placeholder="farmer@agridirect.com"
    required>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="block text-sm font-semibold text-on-surface-variant">Password</label>
<button class="text-xs font-bold text-primary tracking-tight" type="button">Forgot?</button>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline" data-icon="lock">lock</span>
<input
    type="password"
    name="password"
    class="w-full bg-surface-container-low border-none rounded-xl py-4 pl-12 pr-4 focus:ring-2 focus:ring-primary/20 focus:bg-surface-container transition-all placeholder:text-outline-variant"
    placeholder="••••••••"
    required>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-outline cursor-pointer" data-icon="visibility">visibility</span>
</div>
</div>
<!-- Login Button -->
<button class="w-full bg-primary text-on-primary font-headline font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-[0.98] transition-transform duration-150 mt-4" type="submit">
                    Sign In
                </button>
</form>
<!-- Divider -->
<div class="relative my-10 flex items-center">
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
<span class="px-4 text-xs font-bold text-outline uppercase tracking-[0.2em]">Social login</span>
<div class="flex-grow h-[1px] bg-outline-variant/30"></div>
</div>
<!-- Social Options -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 bg-surface-container-high py-4 rounded-xl font-semibold text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">

<span>Google</span>
</button>
<button class="flex items-center justify-center gap-3 bg-surface-container-high py-4 rounded-xl font-semibold text-on-surface hover:bg-surface-container-highest transition-colors active:scale-95 duration-150">
<span class="material-symbols-outlined text-[#1877F2]" data-icon="facebook" style="font-variation-settings: 'FILL' 1;">social_leaderboard</span>
<span>Facebook</span>
</button>
</div>
<!-- Footer Link -->
<p class="text-center mt-12 text-on-surface-variant font-medium">
    Don't have an account?
    <a href="/register" class="text-secondary font-bold ml-1">
        Create Account
    </a>
</p>
</div>
</main>
<!-- Bottom Navigation Suppression Logic: This is a focused login screen, so global nav is omitted for UX focus -->
<!-- Back to top floating indicator (Subtle) -->
<div class="fixed top-8 left-8 z-50">
<button class="w-10 h-10 flex items-center justify-center bg-white/40 backdrop-blur-md rounded-full text-on-surface-variant active:scale-90 transition-transform">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
</div>
