            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;

<body class="bg-background text-on-background font-body antialiased">
<!-- Top AppBar -->
<header class="docked w-full top-0 sticky z-50 bg-[#f6fbf0] dark:bg-stone-950 flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-3">
<button class="text-[#006b1b] dark:text-[#43A047] active:scale-95 duration-150">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-bold text-lg tracking-tight text-[#181d16] dark:text-stone-400">Post New Ad</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#006b1b] dark:text-[#43A047]">help_outline</span>
</div>
</header>
<main class="pb-32 px-6 pt-4 max-w-md mx-auto">
<!-- Hero Header -->
<div class="mb-8">
<h2 class="font-headline font-extrabold text-2xl tracking-tight text-on-background leading-tight">
                Share your harvest with <span class="text-primary">direct buyers.</span>
</h2>
<p class="text-on-surface-variant body-lg mt-2 opacity-80">Fill in the details to reach local markets instantly.</p>
</div>
<form method="POST"
      enctype="multipart/form-data"
      class="space-y-8">
<!-- Image Upload Section -->
<section>
<label class="block font-label text-xs font-bold tracking-widest uppercase text-on-surface-variant mb-3">
    Product Photos
</label>

<div class="grid grid-cols-2 gap-4">

    <!-- Hidden File Input -->
    <input
        type="file"
        name="image"
        accept="image/*"
        required
        class="hidden"
        id="imageInput">

    <!-- Upload Box -->
    <label for="imageInput"
           class="aspect-square bg-surface-container-low rounded-xl flex flex-col items-center justify-center border-2 border-dashed border-outline-variant/30 hover:bg-surface-container transition-colors cursor-pointer group">

        <span class="material-symbols-outlined text-primary text-3xl mb-2 group-active:scale-90 transition-transform">
            add_a_photo
        </span>

        <span class="font-label text-[10px] font-medium text-on-surface-variant uppercase tracking-wider">
            Add Photo
        </span>

    </label>

    <!-- Preview Image -->
    <div class="aspect-square rounded-xl overflow-hidden relative">
        <img class="w-full h-full object-cover"
             src="https://lh3.googleusercontent.com/aida-public/AB6AXuD8tmWEHiHl5PLxRJbp21NYBuoeQhIGhcfv-SNwT0S5cLwEGo_C07muXold3Jejr0dyx2eG_0yiq07sK-Lna41YVSc8ucIFx4QITrRY7mXBOH4QxXPIqJ3iIvygSGTJCDSqU8nB_CrpMjokS-kp7KCydX5zSFv7Q5djB1o0U-9uLGAFoDPWLSFjbAfCn1Pk7hNMbvjef0UKinFPuqfek3AR1OUflQcNHIdrYoeDHs5CYsP6YglWEwgUsVTEW5tCirxZj2jGyz9djF0"/>

        <button class="absolute top-2 right-2 bg-on-background/20 backdrop-blur-md rounded-full p-1 text-white">
            <span class="material-symbols-outlined text-sm">
                close
            </span>
        </button>
    </div>

</div>
</section>
<!-- Basic Info -->
<section class="space-y-5">
<div class="relative">
<label class="block font-label text-[10px] font-bold tracking-widest uppercase text-primary mb-1 ml-1">Product Name</label>
<input
type="text"
name="name"
required
class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary/20 text-on-background placeholder:text-on-surface-variant/40"
placeholder="e.g. Organic Farm-Fresh Spinach"/>
</div>
<div>
<label class="block font-label text-[10px] font-bold tracking-widest uppercase text-on-surface-variant mb-3 ml-1">Category</label>
<div>
    <label class="block font-label text-[10px] font-bold tracking-widest uppercase text-on-surface-variant mb-3 ml-1">
        Category
    </label>

    <select
        name="category"
        required
        class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary/20">

        <option value="">Select Category</option>
        <option value="Vegetables">Vegetables</option>
        <option value="Fruits">Fruits</option>
        <option value="Grains">Grains</option>
        <option value="Dairy">Dairy</option>

    </select>
</div>
</div>
</section>
<!-- Pricing & Quantity -->
<section class="grid grid-cols-2 gap-4">
<div class="relative">
<label class="block font-label text-[10px] font-bold tracking-widest uppercase text-on-surface-variant mb-1 ml-1">Price (₹)</label>
<input
    type="number"
    name="price"
    required
    class="w-full bg-surface-container-low border-none rounded-xl px-4 py-4 focus:ring-2 focus:ring-primary/20 text-on-background placeholder:text-on-surface-variant/40"
    placeholder="0.00">
</div>
<div class="relative">
<label class="block font-label text-[10px] font-bold tracking-widest uppercase text-on-surface-variant mb-1 ml-1">Quantity</label>
<div class="flex items-center bg-surface-container-low rounded-xl pr-4">
<input
    type="number"
    name="quantity"
    required
    class="w-full bg-transparent border-none px-4 py-4 focus:ring-0 text-on-background placeholder:text-on-surface-variant/40"
    placeholder="50">
<span class="text-[10px] font-bold text-secondary tracking-widest uppercase">KG</span>
</div>
</div>
</section>

<!-- Submit Action -->
<div class="pt-4">
<button class="w-full bg-primary text-on-primary font-headline font-bold py-5 rounded-xl shadow-xl shadow-primary/10 active:scale-95 transition-transform flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
                    Publish Advertisement
                </button>
<p class="text-center text-[10px] text-on-surface-variant font-medium mt-4 uppercase tracking-widest">By publishing, you agree to our <span class="text-secondary">quality standards</span></p>
</div>
</form>
</main>
<!-- Bottom Navigation Bar (Context: Ads section) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-3 bg-[#f6fbf0]/80 dark:bg-stone-900/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(24,29,22,0.06)] rounded-t-[2rem] border-t border-[#bfcab9]/20">
<a class="flex flex-col items-center justify-center text-[#181d16]/60 dark:text-stone-400 px-5 py-1.5 hover:bg-[#f0f5ea] dark:hover:bg-stone-800 rounded-2xl transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#eaf0e4] dark:bg-[#006b1b]/20 text-[#006b1b] dark:text-[#43A047] rounded-2xl px-5 py-1.5 active:scale-90 transition-transform duration-200" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase mt-1">Ads</span>
</a>
<a class="flex flex-col items-center justify-center text-[#181d16]/60 dark:text-stone-400 px-5 py-1.5 hover:bg-[#f0f5ea] dark:hover:bg-stone-800 rounded-2xl transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">mail</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase mt-1">Inbox</span>
</a>
<a class="flex flex-col items-center justify-center text-[#181d16]/60 dark:text-stone-400 px-5 py-1.5 hover:bg-[#f0f5ea] dark:hover:bg-stone-800 rounded-2xl transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">notifications</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase mt-1">Alerts</span>
</a>
<a class="flex flex-col items-center justify-center text-[#181d16]/60 dark:text-stone-400 px-5 py-1.5 hover:bg-[#f0f5ea] dark:hover:bg-stone-800 rounded-2xl transition-colors active:scale-90" href="#">
<span class="material-symbols-outlined">person</span>
<span class="font-['Inter'] text-[10px] font-medium tracking-wide uppercase mt-1">Profile</span>
</a>
</nav>
</body></html>
