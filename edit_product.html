<!DOCTYPE html>
<html>
<head>
    <title>Edit Product</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 flex justify-center items-center min-h-screen">

<div class="w-[375px] bg-white rounded-3xl shadow-xl p-6">

    <h1 class="text-2xl font-bold text-green-700 mb-6 text-center">
        ✏ Edit Product
    </h1>

    <form method="POST">

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                Product Name
            </label>

            <input
                type="text"
                name="name"
                value="{{ product[1] }}"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                Category
            </label>

            <input
                type="text"
                name="category"
                value="{{ product[2] }}"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <div class="mb-4">
            <label class="block mb-2 font-semibold">
                Price
            </label>

            <input
                type="number"
                name="price"
                value="{{ product[3] }}"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <div class="mb-6">
            <label class="block mb-2 font-semibold">
                Quantity
            </label>

            <input
                type="number"
                name="quantity"
                value="{{ product[4] }}"
                required
                class="w-full border rounded-lg p-3">
        </div>

        <button
            type="submit"
            class="w-full bg-green-600 text-white py-3 rounded-lg font-bold">

            Update Product
        </button>

    </form>

</div>

</body>
</html>
